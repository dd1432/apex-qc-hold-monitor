<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>APEX QC Hold Roll Monitor</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="app-header">

        <div class="header-left">

            <h1>
                APEX QC HOLD ROLL MONITOR
            </h1>

            <p>
                Quality Control Hold Roll Management
            </p>

        </div>


        <div class="header-right">

            <button
                id="addHoldBtn"
                class="btn-primary"
                type="button"
            >
                + Add QC Hold
            </button>

        </div>

    </header>


    <!-- =================================================
         SUMMARY
    ================================================== -->

    <section class="summary-grid">

        <div class="summary-card">

            <div class="summary-title">
                Active Holds
            </div>

            <div
                id="activeHolds"
                class="summary-value"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Action Required
            </div>

            <div
                id="actionRequired"
                class="summary-value"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Over 24 Hours
            </div>

            <div
                id="over24"
                class="summary-value"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Over 48 Hours
            </div>

            <div
                id="over48"
                class="summary-value"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Released
            </div>

            <div
                id="released"
                class="summary-value"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-title">
                Total Hold Weight
            </div>

            <div
                id="totalWeight"
                class="summary-value"
            >
                0 kg
            </div>

        </div>

    </section>


    <!-- =================================================
         TABS
    ================================================== -->

    <section class="tabs-section">

        <div class="tabs">

            <button
                class="tab active"
                data-tab="active"
                type="button"
            >
                Active Holds
            </button>


            <button
                class="tab"
                data-tab="history"
                type="button"
            >
                History
            </button>

        </div>


        <!-- =================================================
             FILTERS
        ================================================== -->

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Search Job / Roll / Machine / Operator..."
            >


            <select id="processFilter">

                <option value="">
                    All Processes
                </option>

                <option value="Printing">
                    Printing
                </option>

                <option value="Lamination">
                    Lamination
                </option>

                <option value="Slitting">
                    Slitting
                </option>

                <option value="Doctoring">
                    Doctoring
                </option>

                <option value="Inspection">
                    Inspection
                </option>

                <option value="Extrusion Coating">
                    Extrusion Coating
                </option>

            </select>


            <select id="statusFilter">

                <option value="">
                    All Status
                </option>

                <option value="HOLD">
                    Hold
                </option>

                <option value="INSPECTION">
                    Inspection
                </option>

                <option value="INSPECTION_DONE">
                    Inspection Done
                </option>

                <option value="SHADE_APPROVAL">
                    Shade Approval
                </option>

                <option value="REVIEW">
                    Review
                </option>

                <option value="RELEASED">
                    Released
                </option>

                <option value="REJECTED">
                    Rejected
                </option>

            </select>


            <select id="reasonFilter">

                <option value="">
                    All Hold Reasons
                </option>

                <option value="Shade Mismatch">
                    Shade Mismatch
                </option>

                <option value="GSM / Weight">
                    GSM / Weight
                </option>

                <option value="Damage">
                    Damage
                </option>

                <option value="Quality Issue">
                    Quality Issue
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>

    </section>


    <!-- =================================================
         HOLD LIST
    ================================================== -->

    <main class="content">

        <div
            id="holdList"
            class="hold-list"
        ></div>


        <div
            id="historyList"
            class="hold-list hidden"
        ></div>

    </main>


    <!-- =================================================
         ADD HOLD MODAL
    ================================================== -->

    <div
        id="addHoldModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="addHoldTitle"
        aria-hidden="true"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="addHoldTitle">
                    Add QC Hold Roll
                </h2>

                <button
                    id="closeAddHold"
                    class="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>


            <form id="holdForm">

                <div class="form-grid">


                    <div class="form-group">

                        <label for="jobNo">
                            Job Number *
                        </label>

                        <input
                            type="text"
                            id="jobNo"
                            name="jobNo"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="jobName">
                            Job Name
                        </label>

                        <input
                            type="text"
                            id="jobName"
                            name="jobName"
                        >

                    </div>


                    <div class="form-group">

                        <label for="rollNo">
                            Roll Number *
                        </label>

                        <input
                            type="text"
                            id="rollNo"
                            name="rollNo"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="netWeight">
                            Net Weight (kg)
                        </label>

                        <input
                            type="number"
                            id="netWeight"
                            name="netWeight"
                            step="0.01"
                            min="0"
                        >

                    </div>


                    <div class="form-group">

                        <label for="process">
                            Process
                        </label>

                        <select
                            id="process"
                            name="process"
                        >

                            <option value="">
                                Select Process
                            </option>

                            <option value="Printing">
                                Printing
                            </option>

                            <option value="Lamination">
                                Lamination
                            </option>

                            <option value="Slitting">
                                Slitting
                            </option>

                            <option value="Doctoring">
                                Doctoring
                            </option>

                            <option value="Inspection">
                                Inspection
                            </option>

                            <option value="Extrusion Coating">
                                Extrusion Coating
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="machine">
                            Machine
                        </label>

                        <input
                            type="text"
                            id="machine"
                            name="machine"
                        >

                    </div>


                    <div class="form-group">

                        <label for="productionDate">
                            Production Date
                        </label>

                        <input
                            type="date"
                            id="productionDate"
                            name="productionDate"
                        >

                    </div>


                    <div class="form-group">

                        <label for="shift">
                            Shift
                        </label>

                        <select
                            id="shift"
                            name="shift"
                        >

                            <option value="">
                                Select Shift
                            </option>

                            <option value="1st">
                                1st
                            </option>

                            <option value="2nd">
                                2nd
                            </option>

                            <option value="3rd">
                                3rd
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="operator">
                            Operator
                        </label>

                        <input
                            type="text"
                            id="operator"
                            name="operator"
                        >

                    </div>


                    <div class="form-group">

                        <label for="supervisor">
                            Supervisor
                        </label>

                        <input
                            type="text"
                            id="supervisor"
                            name="supervisor"
                        >

                    </div>


                    <div class="form-group">

                        <label for="qcInspector">
                            QC Inspector *
                        </label>

                        <input
                            type="text"
                            id="qcInspector"
                            name="qcInspector"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="holdReason">
                            Hold Reason *
                        </label>

                        <select
                            id="holdReason"
                            name="holdReason"
                            required
                        >

                            <option value="">
                                Select Hold Reason
                            </option>

                            <option value="Shade Mismatch">
                                Shade Mismatch
                            </option>

                            <option value="GSM / Weight">
                                GSM / Weight
                            </option>

                            <option value="Damage">
                                Damage
                            </option>

                            <option value="Quality Issue">
                                Quality Issue
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group full-width">

                        <label for="observation">
                            Observation
                        </label>

                        <textarea
                            id="observation"
                            name="observation"
                            rows="4"
                        ></textarea>

                    </div>


                    <div class="form-group full-width">

                        <label for="labelPhoto">
                            Label Photo
                        </label>

                        <input
                            type="file"
                            id="labelPhoto"
                            name="labelPhoto"
                            accept="image/*"
                        >

                        <div
                            id="uploadProgress"
                            style="margin-top:8px;"
                        ></div>

                        <img
                            id="photoPreview"
                            alt="Photo Preview"
                            style="
                                display:none;
                                max-width:220px;
                                max-height:220px;
                                margin-top:10px;
                                border-radius:8px;
                                object-fit:contain;
                            "
                        >

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        id="cancelHold"
                        class="btn-secondary"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        id="saveHoldBtn"
                        class="btn-primary"
                    >
                        Save QC Hold
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =================================================
         DETAILS MODAL
    ================================================== -->

    <div
        id="detailsModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detailsTitle"
        aria-hidden="true"
    >

        <div class="modal-content details-modal-content">

            <div class="modal-header">

                <h2 id="detailsTitle">
                    QC Hold Roll Details
                </h2>

                <button
                    id="closeDetails"
                    class="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div
                id="detailsContent"
                class="modal-body"
            ></div>

        </div>

    </div>


    <!-- =================================================
         FIREBASE COMPAT SDK
         MUST LOAD BEFORE app.js
    ================================================== -->

    <script
        src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"
    ></script>


    <!-- =================================================
         APPLICATION
    ================================================== -->

    <script src="app.js"></script>

</body>

</html>
