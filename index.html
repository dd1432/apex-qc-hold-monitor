<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QC Hold Roll Monitor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div>
        <h1>QC HOLD ROLL MONITOR</h1>
        <p>Apex Packing Products Pvt. Ltd.</p>
    </div>

    <button id="addHoldBtn" class="primary-btn">
        + ADD HOLD ROLL
    </button>
</header>


<main class="container">

    <!-- SUMMARY -->
    <section class="summary-grid">

        <div class="summary-card">
            <span>Active Holds</span>
            <strong id="activeCount">0</strong>
        </div>

        <div class="summary-card action">
            <span>Action Required</span>
            <strong id="actionCount">0</strong>
        </div>

        <div class="summary-card warning">
            <span>Over 24 Hours</span>
            <strong id="over24Count">0</strong>
        </div>

        <div class="summary-card danger">
            <span>Over 48 Hours</span>
            <strong id="over48Count">0</strong>
        </div>

        <div class="summary-card success">
            <span>Released</span>
            <strong id="releasedCount">0</strong>
        </div>

        <div class="summary-card">
            <span>Total Held Weight</span>
            <strong><span id="totalWeight">0</span> kg</strong>
        </div>

    </section>


    <!-- CONTROLS -->
    <section class="controls">

        <div class="tabs">
            <button class="tab active" data-tab="active">
                Active Holds
            </button>

            <button class="tab" data-tab="history">
                Hold History
            </button>
        </div>

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Search Job No / Roll No / Job Name"
            >

            <select id="processFilter">
                <option value="">All Processes</option>
                <option value="Printing">Printing</option>
                <option value="Lamination">Lamination</option>
                <option value="Slitting">Slitting</option>
                <option value="Doctoring">Doctoring</option>
                <option value="Inspection">Inspection</option>
                <option value="Extrusion Coating">Extrusion Coating</option>
            </select>

            <select id="statusFilter">
                <option value="">All Status</option>
                <option value="HOLD">Hold</option>
                <option value="INSPECTION">Inspection</option>
                <option value="SHADE_APPROVAL">Shade Approval</option>
                <option value="REVIEW">Review</option>
                <option value="RELEASED">Released</option>
                <option value="REJECTED">Rejected</option>
            </select>

            <select id="reasonFilter">
                <option value="">All Hold Reasons</option>
                <option value="Insect / Foreign Material">Insect / Foreign Material</option>
                <option value="Line / Streak">Line / Streak</option>
                <option value="Shade Mismatch">Shade Mismatch</option>
                <option value="GSM / Weight">GSM / Weight</option>
                <option value="Printing Defect">Printing Defect</option>
                <option value="Lamination Defect">Lamination Defect</option>
                <option value="Slitting Defect">Slitting Defect</option>
                <option value="Adhesion">Adhesion</option>
                <option value="Physical Damage">Physical Damage</option>
                <option value="Other">Other</option>
            </select>

        </div>

    </section>


    <!-- HOLD LIST -->
    <section id="holdList" class="hold-list">
        <div class="empty-state">
            Loading...
        </div>
    </section>

</main>


<!-- ADD HOLD MODAL -->
<div id="addHoldModal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">
            <h2>Add Hold Roll</h2>
            <button class="close-btn" id="closeAddHold">×</button>
        </div>


        <form id="holdForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Job Number *</label>
                    <input id="jobNo" required>
                </div>

                <div class="form-group">
                    <label>Job Name *</label>
                    <input id="jobName" required>
                </div>

                <div class="form-group">
                    <label>Roll Number *</label>
                    <input id="rollNo" required>
                </div>

                <div class="form-group">
                    <label>Net Weight (kg) *</label>
                    <input id="netWeight" type="number" step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label>Process *</label>
                    <select id="process" required>
                        <option value="">Select Process</option>
                        <option>Printing</option>
                        <option>Lamination</option>
                        <option>Slitting</option>
                        <option>Doctoring</option>
                        <option>Inspection</option>
                        <option>Extrusion Coating</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Machine</label>
                    <input id="machine" placeholder="Example: Printing 2">
                </div>

                <div class="form-group">
                    <label>Production Date *</label>
                    <input id="productionDate" type="date" required>
                </div>

                <div class="form-group">
                    <label>Shift *</label>
                    <select id="shift" required>
                        <option value="">Select Shift</option>
                        <option>1st</option>
                        <option>2nd</option>
                        <option>3rd</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Operator</label>
                    <input id="operator">
                </div>

                <div class="form-group">
                    <label>Supervisor</label>
                    <input id="supervisor">
                </div>

                <div class="form-group">
                    <label>QC Inspector *</label>
                    <input id="qcInspector" required>
                </div>

                <div class="form-group">
                    <label>Hold Reason *</label>
                    <select id="holdReason" required>
                        <option value="">Select Reason</option>
                        <option>Insect / Foreign Material</option>
                        <option>Line / Streak</option>
                        <option>Shade Mismatch</option>
                        <option>GSM / Weight</option>
                        <option>Printing Defect</option>
                        <option>Lamination Defect</option>
                        <option>Slitting Defect</option>
                        <option>Adhesion</option>
                        <option>Physical Damage</option>
                        <option>Other</option>
                    </select>
                </div>

            </div>


            <div class="form-group full">
                <label>Observation / Hold Details *</label>
                <textarea id="observation" rows="4" required
                    placeholder="Example: Line found on roll during QC inspection..."></textarea>
            </div>


            <div class="form-group full">
                <label>HOLD Label Photo *</label>

                <input
                    id="labelPhoto"
                    type="file"
                    accept="image/*"
                    capture="environment"
                    required
                >

                <small>
                    Take a clear photo of the physical HOLD label.
                </small>

                <div id="photoPreview" class="photo-preview"></div>
            </div>


            <div id="uploadProgress" class="upload-progress hidden">
                Uploading photo...
            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    id="cancelHold"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                    id="saveHoldBtn"
                >
                    SAVE HOLD
                </button>

            </div>

        </form>

    </div>

</div>


<!-- DETAILS MODAL -->
<div id="detailsModal" class="modal hidden">

    <div class="modal-box large">

        <div class="modal-header">
            <h2>Hold Details</h2>
            <button class="close-btn" id="closeDetails">×</button>
        </div>

        <div id="detailsContent"></div>

    </div>

</div>


<!-- Firebase + Application -->
<script type="module" src="app.js"></script>

</body>
</html>
